openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Trading Signal Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: symbols
    description: Watchlist symbol management
  - name: signals
    description: Trading signals
  - name: bars
    description: OHLCV bar data
  - name: ai
    description: AI engine operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /symbols:
    get:
      operationId: listSymbols
      tags: [symbols]
      summary: List watchlist symbols
      responses:
        "200":
          description: List of watchlist symbols
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Symbol"
    post:
      operationId: addSymbol
      tags: [symbols]
      summary: Add symbol to watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SymbolInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Symbol"

  /symbols/{id}:
    delete:
      operationId: removeSymbol
      tags: [symbols]
      summary: Remove symbol from watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /signals:
    get:
      operationId: listSignals
      tags: [signals]
      summary: List signals with optional symbol filter
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"

  /signals/alerts:
    get:
      operationId: getSignalAlerts
      tags: [signals]
      summary: Get recent AI signal alerts for watchlist symbols
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: number
            description: Unix timestamp ms — only alerts created after this time
        - name: symbols
          in: query
          required: false
          schema:
            type: string
            description: Comma-separated symbol list
        - name: minConfidence
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Array of signal alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignalAlert"

  /signals/stats:
    get:
      operationId: getSignalStats
      tags: [signals]
      summary: Get aggregated signal statistics
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Signal statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalStats"

  /signals/ai-decision-stats:
    get:
      operationId: getAiDecisionStats
      tags: [signals]
      summary: Get AI Trade Intelligence Engine performance statistics
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: AI decision performance statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiDecisionStats"

  /signals/candle-decision:
    post:
      operationId: postCandleDecision
      tags: [signals]
      summary: Run AI decision pipeline after a candle closes
      description: |
        Called by the frontend immediately after a live candle closes.
        Fetches bars (rate-limit-safe cache), runs the signal engine,
        evaluates with Ollama, and stores the verdict in the database.
        Always returns 200 with a verdict of APPROVE, REJECT, or WAIT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandleDecisionRequest"
      responses:
        "200":
          description: AI candle decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCandleDecision"

  /signals/ai-active/health:
    get:
      operationId: getAiActiveHealth
      tags: [signals]
      summary: Compute real-time health score for the current active approved AI trade
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            default: "5m"
      responses:
        "200":
          description: Trade health score and dimensional breakdown (null when no active trade)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiActiveHealthResponse"

  /bars:
    get:
      operationId: listBars
      tags: [bars]
      summary: Get OHLCV bars for a symbol
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            default: "5m"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
      responses:
        "200":
          description: List of OHLCV bars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bar"

  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      summary: Get AI model status (decision + vision models)
      responses:
        "200":
          description: AI status including both models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatusExtended"

  /ai/memory:
    get:
      operationId: getAiMemory
      tags: [ai]
      summary: Get DB-backed shared memory stats
      responses:
        "200":
          description: Memory statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiMemorySummary"

  /ai/analyze-chart:
    post:
      operationId: analyzeChart
      tags: [ai]
      summary: Analyze a chart image using the vision model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartAnalysisRequest"
      responses:
        "200":
          description: Chart analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartAnalysisResponse"
        "503":
          description: Vision model not available

  /ai/chart-analyses:
    get:
      operationId: listChartAnalyses
      tags: [ai]
      summary: List recent chart analyses (last 10)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent chart analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartAnalysisRecord"

  /ai/similarity:
    post:
      operationId: querySimilarity
      tags: [ai]
      summary: Query the pattern similarity engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimilarityRequest"
      responses:
        "200":
          description: Similarity matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarityResponse"

  /signals/replay:
    post:
      operationId: startReplay
      tags: [signals]
      summary: Start a memory-vs-no-memory replay job for a symbol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayStartRequest"
      responses:
        "200":
          description: Job started or already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayStartResponse"

  /signals/replay/{jobId}:
    get:
      operationId: getReplayStatus
      tags: [signals]
      summary: Poll a replay job for status and result
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status and optional result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayJobStatus"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Symbol:
      type: object
      required: [id, symbol, name, addedAt]
      properties:
        id:
          type: integer
        symbol:
          type: string
        name:
          type: string
        addedAt:
          type: string
          format: date-time

    SymbolInput:
      type: object
      required: [symbol, name]
      properties:
        symbol:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1

    Signal:
      type: object
      required: [id, signalId, symbol, timeframe, barTime, side, entryPrice, slPrice, tpPrice, confidence, riskTag, state, createdAt]
      properties:
        id:
          type: integer
        signalId:
          type: string
        symbol:
          type: string
        timeframe:
          type: string
        barTime:
          type: string
          format: date-time
        side:
          type: string
          enum: [long, short]
        entryPrice:
          type: number
        slPrice:
          type: number
        tpPrice:
          type: number
        currentSlPrice:
          type: ["number", "null"]
        confidence:
          type: integer
        riskTag:
          type: string
          enum: [Safe, Medium, Danger]
        state:
          type: string
          enum: [active, tp_hit, sl_hit, expired]
        exitPrice:
          type: ["number", "null"]
        exitReason:
          type: ["string", "null"]
        exitBarTime:
          type: ["string", "null"]
          format: date-time
        rrRatio:
          type: ["number", "null"]
        pattern:
          type: ["string", "null"]
        regime:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    SignalAlert:
      type: object
      required: [id, symbol, timeframe, verdict, confidence, candleTime, createdAt]
      properties:
        id:
          type: integer
        symbol:
          type: string
        timeframe:
          type: string
        verdict:
          type: string
          description: LONG or SHORT
        confidence:
          type: integer
        entryPrice:
          type: number
          nullable: true
        rrRatio:
          type: number
          nullable: true
        regime:
          type: string
          nullable: true
        candleTime:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    SignalStats:
      type: object
      required: [total, active, tp_hit, sl_hit, expired, winRate, avgConfidence, avgRR]
      properties:
        total:
          type: integer
        active:
          type: integer
        tp_hit:
          type: integer
        sl_hit:
          type: integer
        expired:
          type: integer
        winRate:
          type: number
        avgConfidence:
          type: number
        avgRR:
          type: number

    AiDecisionRegimeStat:
      type: object
      required: [tp_hit, sl_hit, expired, total, winRate]
      properties:
        tp_hit:
          type: integer
        sl_hit:
          type: integer
        expired:
          type: integer
        total:
          type: integer
        winRate:
          type: number

    AiDecisionStats:
      type: object
      required: [total, resolved, tp_hit, sl_hit, expired, winRate, avgRR, byRegime]
      properties:
        total:
          type: integer
          description: All ai_decisions rows matching the filter
        resolved:
          type: integer
          description: Rows with a non-null outcome
        tp_hit:
          type: integer
        sl_hit:
          type: integer
        expired:
          type: integer
        winRate:
          type: number
          description: tp_hit / (tp_hit + sl_hit), 0 when no closed decisions
        avgRR:
          type: number
          description: Average R:R ratio of resolved decisions with an rrRatio set
        byRegime:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AiDecisionRegimeStat"

    Bar:
      type: object
      required: [time, open, high, low, close, volume]
      properties:
        time:
          type: integer
          description: Unix timestamp in seconds
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number

    AiStatusExtended:
      type: object
      required: [available, model, endpoint, visionModel, visionAvailable, message]
      properties:
        available:
          type: boolean
        model:
          type: string
        endpoint:
          type: string
        visionModel:
          type: string
        visionAvailable:
          type: boolean
        message:
          type: string

    PatternGroupStat:
      type: object
      required: [symbol, regime, side, strategy, winRate, sampleSize, avgRR]
      properties:
        symbol:
          type: string
        regime:
          type: string
        side:
          type: string
        strategy:
          type: string
        winRate:
          type: number
        sampleSize:
          type: integer
        avgRR:
          type: number

    AiMemorySummary:
      type: object
      required: [ok, source, totalTrades, lessonsCount, patternsCount, similarityMatchesCount, topSimilarityMatches, recentLessons, updatedAt]
      properties:
        ok:
          type: boolean
        source:
          type: string
        totalTrades:
          type: integer
        lessonsCount:
          type: integer
        patternsCount:
          type: integer
        similarityMatchesCount:
          type: integer
          description: Number of unique pattern groups queryable for similarity matching
        topSimilarityMatches:
          type: array
          description: Top pattern groups by historical win rate (n >= 3)
          items:
            $ref: "#/components/schemas/PatternGroupStat"
        regimeStats:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/WinLossStat"
        strategyStats:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/WinLossStat"
        symbolStats:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/WinLossStat"
        recentLessons:
          type: array
          items:
            type: string
        updatedAt:
          type: string

    WinLossStat:
      type: object
      required: [wins, losses, total]
      properties:
        wins:
          type: integer
        losses:
          type: integer
        total:
          type: integer

    AiTradeHealth:
      type: object
      required: [score, breakdown, direction, summary]
      properties:
        score:
          type: integer
          description: Composite health score 0–100
        breakdown:
          type: object
          required: [emaTrend, momentum, volume, priceProgress, patternIntegrity, memoryAlignment]
          properties:
            emaTrend:         { type: integer, description: "EMA trend alignment (0–25)" }
            momentum:         { type: integer, description: "RSI momentum score (0–20)" }
            volume:           { type: integer, description: "Volume confirmation (0–15)" }
            priceProgress:    { type: integer, description: "Price progress toward TP (0–25)" }
            patternIntegrity: { type: integer, description: "Pattern/setup integrity (0–10)" }
            memoryAlignment:  { type: integer, description: "Memory impact alignment (0–5)" }
        direction:
          type: string
          enum: [improving, deteriorating, neutral]
          description: Price movement direction relative to trade thesis over last 5 bars
        summary:
          type: string
          description: One-sentence plain-English health summary

    AiActiveHealthResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        health:
          description: null when no active approved trade exists
          oneOf:
            - $ref: "#/components/schemas/AiTradeHealth"
            - type: "null"

    ChartAnalysisRequest:
      type: object
      required: [imageBase64]
      properties:
        imageBase64:
          type: string
          description: Base64-encoded chart image (PNG or JPEG)
        thumbnailBase64:
          type: string
          description: Small base64 JPEG thumbnail generated client-side for the recent-analyses list
        symbol:
          type: string
        timeframe:
          type: string
        signalId:
          type: string

    ChartAnalysis:
      type: object
      required: [trend, patterns, resistanceLevels, supportLevels, volumeBehavior, marketStructure, supplyZones, demandZones, summary, confidence]
      properties:
        trend:
          type: string
          enum: [strong_uptrend, uptrend, neutral, downtrend, strong_downtrend]
        patterns:
          type: array
          items:
            type: string
        resistanceLevels:
          type: array
          items:
            type: number
        supportLevels:
          type: array
          items:
            type: number
        volumeBehavior:
          type: string
          enum: [expanding, contracting, climax, normal, weak]
        marketStructure:
          type: string
          enum: [higher_highs_lows, lower_highs_lows, range_bound, breakout, breakdown, unclear]
        supplyZones:
          type: array
          items:
            type: number
        demandZones:
          type: array
          items:
            type: number
        summary:
          type: string
        confidence:
          type: integer

    AiDecision:
      type: object
      required: [direction, confidence, entry, stopLoss, takeProfit1, takeProfit2, takeProfit3, riskReward, technicalReasoning, marketStructureReasoning, historicalReasoning, successProbability]
      properties:
        direction:
          type: string
          enum: [LONG, SHORT, NO_TRADE]
        confidence:
          type: integer
        entry:
          type: number
        stopLoss:
          type: number
        takeProfit1:
          type: number
        takeProfit2:
          type: number
        takeProfit3:
          type: number
        riskReward:
          type: number
        technicalReasoning:
          type: string
        marketStructureReasoning:
          type: string
        historicalReasoning:
          type: string
        successProbability:
          type: integer
        noTradeReason:
          type: string
        noTradeMissingCondition:
          type: string
        noTradeBreakoutLevel:
          type: number
        noTradeBreakdownLevel:
          type: number
        noTradeConfirmationCandle:
          type: string
        noTradeVolumeCondition:
          type: string

    ChartAnalysisResponse:
      type: object
      required: [ok, analysis, historicalMatches]
      properties:
        ok:
          type: boolean
        analysis:
          $ref: "#/components/schemas/ChartAnalysis"
        historicalMatches:
          type: array
          items:
            $ref: "#/components/schemas/SimilarityMatch"
        decision:
          $ref: "#/components/schemas/AiDecision"
        decisionAvailable:
          type: boolean

    SimilarityMatch:
      type: object
      required: [symbol, regime, side, strategy, patternTags, session, htfBias, historicalWinRate, avgRR, sampleSize, matchScore, recentOutcomes]
      properties:
        symbol:
          type: string
        regime:
          type: string
        side:
          type: string
        strategy:
          type: string
        patternTags:
          type: array
          items:
            type: string
        session:
          type: string
        htfBias:
          type: string
        historicalWinRate:
          type: number
        avgRR:
          type: number
        sampleSize:
          type: integer
        matchScore:
          type: integer
        recentOutcomes:
          type: array
          items:
            type: string

    AiLesson:
      type: object
      required: [id, signalId, symbol, side, strategy, regime, outcome, lesson, failureCategory, confidence, createdAt]
      properties:
        id:
          type: integer
        signalId:
          type: string
        symbol:
          type: string
        side:
          type: string
        strategy:
          type: string
        regime:
          type: string
        session:
          type: string
        outcome:
          type: string
        lesson:
          type: string
        weaknesses:
          type: array
          items:
            type: string
        failureCategory:
          type: string
          enum: [news_issue, bad_entry, poor_risk, pattern_failure, false_breakout, weak_volume, trend_reversal, regime_mismatch, incorrect_confidence, unknown]
        trapType:
          type: ["string", "null"]
        continuationProbability:
          type: number
        confidence:
          type: integer
        createdAt:
          type: string
          format: date-time

    AiPattern:
      type: object
      required: [id, symbol, regime, side, strategy, outcome, confidence, createdAt]
      properties:
        id:
          type: integer
        symbol:
          type: string
        regime:
          type: string
        side:
          type: string
        strategy:
          type: string
        patternTags:
          type: array
          items:
            type: string
        outcome:
          type: string
        confidence:
          type: integer
        rrRatio:
          type: number
        createdAt:
          type: string
          format: date-time

    ChartAnalysisRecord:
      type: object
      required: [id, trend, patterns, resistanceLevels, supportLevels, volumeBehavior, marketStructure, supplyZones, demandZones, summary, confidence, createdAt]
      properties:
        id:
          type: integer
        signalId:
          type: ["string", "null"]
        symbol:
          type: ["string", "null"]
        timeframe:
          type: ["string", "null"]
        trend:
          type: string
        patterns:
          type: array
          items:
            type: string
        resistanceLevels:
          type: array
          items:
            type: number
        supportLevels:
          type: array
          items:
            type: number
        volumeBehavior:
          type: string
        marketStructure:
          type: string
        supplyZones:
          type: array
          items:
            type: number
        demandZones:
          type: array
          items:
            type: number
        summary:
          type: string
        confidence:
          type: integer
        direction:
          type: ["string", "null"]
        entryPrice:
          type: ["number", "null"]
        slPrice:
          type: ["number", "null"]
        tpPrice:
          type: ["number", "null"]
        rrRatio:
          type: ["number", "null"]
        decisionConfidence:
          type: ["integer", "null"]
        successProbability:
          type: ["integer", "null"]
        technicalReasoning:
          type: ["string", "null"]
        thumbnailBase64:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    SimilarityRequest:
      type: object
      required: [symbol, side]
      properties:
        symbol:
          type: string
        regime:
          type: string
        side:
          type: string
          enum: [long, short]
        strategy:
          type: string
        patternTags:
          type: array
          items:
            type: string
        session:
          type: string

    SimilarityResponse:
      type: object
      required: [ok, matches]
      properties:
        ok:
          type: boolean
        matches:
          type: array
          items:
            $ref: "#/components/schemas/SimilarityMatch"

    CandleDecisionRequest:
      type: object
      required: [symbol, timeframe, candleTime]
      properties:
        symbol:
          type: string
          description: Ticker symbol (e.g. TSLA)
        timeframe:
          type: string
          description: Bar timeframe (5m, 15m, 1h)
        candleTime:
          type: number
          description: Epoch seconds of the CLOSED candle's open time

    AiCandleDecision:
      type: object
      required:
        - symbol
        - timeframe
        - candleTime
        - candidateSide
        - verdict
        - confidence
        - aiReasoning
        - newsSentiment
        - newsSummary
        - regime
        - htfBias
        - session
        - patterns
      properties:
        symbol:
          type: string
        timeframe:
          type: string
        candleTime:
          type: number
          description: Epoch seconds of the closed candle
        candidateSide:
          type: string
          enum: [long, short, no_trade]
        verdict:
          type: string
          enum: [APPROVE, REJECT, WAIT]
        confidence:
          type: integer
          minimum: 0
          maximum: 100
        entryPrice:
          type: ["number", "null"]
        slPrice:
          type: ["number", "null"]
        tpPrice:
          type: ["number", "null"]
        invalidationLevel:
          type: ["number", "null"]
        rrRatio:
          type: ["number", "null"]
        aiReasoning:
          type: string
        rejectionReason:
          type: ["string", "null"]
        newsSentiment:
          type: string
          enum: [bullish, bearish, neutral]
        newsSummary:
          type: string
        regime:
          type: string
        htfBias:
          type: string
        session:
          type: string
        patterns:
          type: array
          items:
            type: string
        technicalContext:
          type: object
          additionalProperties: true
        memoryUsed:
          type: boolean
          nullable: true
        lessonsLoaded:
          type: integer
          minimum: 0
          nullable: true
        winnerAnalysisLoaded:
          type: boolean
          nullable: true
        failureStatsLoaded:
          type: boolean
          nullable: true
        recentLossLoaded:
          type: boolean
          nullable: true
        memoryImpactScore:
          type: integer
          minimum: 0
          maximum: 100
          nullable: true

    ReplayStartRequest:
      type: object
      required: [symbol]
      properties:
        symbol:
          type: string
        timeframe:
          type: string
          default: "5m"
        limit:
          type: integer
          minimum: 5
          maximum: 200
          default: 50

    ReplayStartResponse:
      type: object
      required: [jobId]
      properties:
        jobId:
          type: string
        alreadyRunning:
          type: boolean

    ReplayPassStats:
      type: object
      required: [approve, wait, reject, total, approveRate, avgConf, avgRR, topLessons, topRejectLessons]
      properties:
        approve:
          type: integer
        wait:
          type: integer
        reject:
          type: integer
        total:
          type: integer
        approveRate:
          type: number
          description: approve / total (0–1)
        avgConf:
          type: number
        avgRR:
          type: number
        topLessons:
          type: array
          items:
            type: string
        topRejectLessons:
          type: array
          items:
            type: string
          description: Lessons most frequently cited when memory still returned REJECT or WAIT

    ReplayDelta:
      type: object
      required: [removedByMemory, addedByMemory, avgConfChange, approveRateDelta]
      properties:
        removedByMemory:
          type: integer
        addedByMemory:
          type: integer
        avgConfChange:
          type: number
        approveRateDelta:
          type: number
          description: withMem.approveRate − noMem.approveRate; positive = memory increased signal rate

    ReplayResult:
      type: object
      required: [symbol, timeframe, processed, noMem, withMem, delta]
      properties:
        symbol:
          type: string
        timeframe:
          type: string
        processed:
          type: integer
        candles:
          type: array
          description: Per-candle raw results used to derive chart markers
          items:
            type: object
            additionalProperties: true
        noMem:
          $ref: "#/components/schemas/ReplayPassStats"
        withMem:
          $ref: "#/components/schemas/ReplayPassStats"
        delta:
          $ref: "#/components/schemas/ReplayDelta"

    ReplayJobStatus:
      type: object
      required: [jobId, status, progress, total]
      properties:
        jobId:
          type: string
        status:
          type: string
          enum: [running, done, error]
        progress:
          type: integer
        total:
          type: integer
        result:
          oneOf:
            - $ref: "#/components/schemas/ReplayResult"
            - type: "null"
        error:
          type: ["string", "null"]
