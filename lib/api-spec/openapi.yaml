    ReplayPassStats:
      type: object
      required: [approve, wait, reject, total, approveRate, avgConf, avgRR, winRate, profitFactor, maxDrawdown, simulated, avgTradeGrade, topLessons, topRejectLessons]
      properties:
        approve:
          type: integer
        wait:
          type: integer
        reject:
          type: integer
        total:
          type: integer
        approveRate:
          type: number
          description: approve / total (0–1)
        avgConf:
          type: number
        avgRR:
          type: number
        winRate:
          type: number
          description: tp_hit / (tp_hit + sl_hit) from lifecycle simulation, 0 when no closed trades
        profitFactor:
          type: number
          description: sum(winning RR multiples) / count(losses), max 9.99
        maxDrawdown:
          type: number
          description: Max peak-to-trough drawdown in R units from equity curve
        simulated:
          type: integer
          description: Number of approved signals with lifecycle outcome simulated
        avgTradeGrade:
          type: string
          description: "Letter grade A–F based on winRate + profitFactor"
        topLessons:
          type: array
          items:
            type: string
        topRejectLessons:
          type: array
          items:
            type: string
          description: Lessons most frequently cited when memory still returned REJECT or WAIT

    ReplayDelta:
      type: object
      required: [removedByMemory, addedByMemory, changedByMemory, avgConfChange, approveRateDelta]
      properties:
        removedByMemory:
          type: integer
        addedByMemory:
          type: integer
        changedByMemory:
          type: integer
          description: Candles where memory changed confidence class (conf_boost or conf_drop)
        avgConfChange:
          type: number
        approveRateDelta:
          type: number
          description: withMem.approveRate − noMem.approveRate; positive = memory increased signal rate

