      type: object
      required: [candleTime, direction, noMemVerdict, withMemVerdict, noMemConf, withMemConf]
      properties:
        candleTime:
          type: number
        direction:
          type: string
          enum: [memory_added, memory_removed, direction_flipped, conf_boost, conf_drop]
        noMemVerdict:
          type: string
        withMemVerdict:
          type: string
        noMemConf:
          type: number
        withMemConf:
          type: number
        keyLesson:
          type: string
          nullable: true
          description: Top lesson from the with-memory pass that caused this divergence

    ReplayResult:
      type: object
      required: [symbol, timeframe, processed, noMem, withMem, delta, learningScore, decisionDiffs]
      properties:
        symbol:
          type: string
        timeframe:
          type: string
        processed:
          type: integer
        candles:
          type: array
          description: Per-candle raw results used to derive chart markers
          items:
            type: object
            additionalProperties: true
        noMem:
          $ref: "#/components/schemas/ReplayPassStats"
        withMem:
          $ref: "#/components/schemas/ReplayPassStats"
        delta:
          $ref: "#/components/schemas/ReplayDelta"
        learningScore:
          type: integer
          description: 0–100 composite learning effectiveness score
          minimum: 0
          maximum: 100
        memoryValueScore:
          type: integer
          description: 0–100 memory value score (loss avoidance, WR improvement, PF improvement, trade filtration)
          minimum: 0
          maximum: 100
        lossesAvoided:
          type: integer
          description: Count of noMem sl_hit outcomes that memory prevented by not approving the trade
        decisionChangingLessons:
          type: array
          description: Top 20 lessons most frequently associated with memory-driven decision divergences
          items:
            type: string
        decisionDiffs:
          type: array
          description: Candles where noMem and withMem verdicts diverged
          items:
            $ref: "#/components/schemas/ReplayDecisionDiff"

