openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Trading Signal Platform API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: symbols
    description: Watchlist symbol management
  - name: signals
    description: Trading signals
  - name: bars
    description: OHLCV bar data
  - name: ai
    description: AI engine operations
  - name: news
    description: Market news
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /symbols:
    get:
      operationId: listSymbols
      tags: [symbols]
      summary: List watchlist symbols
      responses:
        "200":
          description: List of watchlist symbols
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Symbol"
    post:
      operationId: addSymbol
      tags: [symbols]
      summary: Add symbol to watchlist
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SymbolInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Symbol"

  /symbols/{id}:
    delete:
      operationId: removeSymbol
      tags: [symbols]
      summary: Remove symbol from watchlist
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /signals:
    get:
      operationId: listSignals
      tags: [signals]
      summary: List signals with optional symbol filter
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
      responses:
        "200":
          description: List of signals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Signal"

  /signals/alerts:
    get:
      operationId: getSignalAlerts
      tags: [signals]
      summary: Get recent AI signal alerts for watchlist symbols
      parameters:
        - name: since
          in: query
          required: false
          schema:
            type: number
            description: Unix timestamp ms — only alerts created after this time
        - name: symbols
          in: query
          required: false
          schema:
            type: string
            description: Comma-separated symbol list
        - name: minConfidence
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Array of signal alerts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SignalAlert"

  /signals/stats:
    get:
      operationId: getSignalStats
      tags: [signals]
      summary: Get aggregated signal statistics
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Signal statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SignalStats"

  /signals/ai-decision-stats:
    get:
      operationId: getAiDecisionStats
      tags: [signals]
      summary: Get AI Trade Intelligence Engine performance statistics
      parameters:
        - name: symbol
          in: query
          required: false
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: AI decision performance statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiDecisionStats"

  /signals/candle-decision:
    post:
      operationId: postCandleDecision
      tags: [signals]
      summary: Run AI decision pipeline after a candle closes
      description: |
        Called by the frontend immediately after a live candle closes.
        Fetches bars (rate-limit-safe cache), runs the signal engine,
        evaluates with Ollama, and stores the verdict in the database.
        Always returns 200 with a verdict of APPROVE, REJECT, or WAIT.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandleDecisionRequest"
      responses:
        "200":
          description: AI candle decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiCandleDecision"

  /signals/ai-active/health:
    get:
      operationId: getAiActiveHealth
      tags: [signals]
      summary: Compute real-time health score for the current active approved AI trade
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            default: "5m"
      responses:
        "200":
          description: Trade health score and dimensional breakdown (null when no active trade)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiActiveHealthResponse"

  /bars:
    get:
      operationId: listBars
      tags: [bars]
      summary: Get OHLCV bars for a symbol
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            default: "5m"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 200
      responses:
        "200":
          description: List of OHLCV bars
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Bar"

  /ai/status:
    get:
      operationId: getAiStatus
      tags: [ai]
      summary: Get AI model status (decision + vision models)
      responses:
        "200":
          description: AI status including both models
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiStatusExtended"

  /ai/memory:
    get:
      operationId: getAiMemory
      tags: [ai]
      summary: Get DB-backed shared memory stats
      responses:
        "200":
          description: Memory statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiMemorySummary"

  /ai/analyze-chart:
    post:
      operationId: analyzeChart
      tags: [ai]
      summary: Analyze a chart image using the vision model
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChartAnalysisRequest"
      responses:
        "200":
          description: Chart analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChartAnalysisResponse"
        "503":
          description: Vision model not available

  /ai/chart-analyses:
    get:
      operationId: listChartAnalyses
      tags: [ai]
      summary: List recent chart analyses (last 10)
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
      responses:
        "200":
          description: Recent chart analyses
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChartAnalysisRecord"

  /ai/similarity:
    post:
      operationId: querySimilarity
      tags: [ai]
      summary: Query the pattern similarity engine
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SimilarityRequest"
      responses:
        "200":
          description: Similarity matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SimilarityResponse"

  /signals/snapshot-decision:
    post:
      operationId: postSnapshotDecision
      tags: [signals]
      summary: Build a pure-technical market snapshot and get an AI BUY/SELL/WAIT decision (no memory)
      description: |
        Fetches bars, runs the full Market Snapshot Engine (indicators, structure,
        S/R, pivots, fibonacci, OBs, FVGs), then calls Ollama for a BUY/SELL/WAIT
        decision without loading any AI memory context.
        Hard rules: confidence ≥ 75, R:R ≥ 1.8, no BUY within 0.5 % of resistance,
        no SELL within 0.5 % of support.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CandleDecisionRequest"
      responses:
        "200":
          description: Snapshot-based AI decision
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SnapshotDecision"

  /signals/snapshot-decisions:
    get:
      operationId: listSnapshotDecisions
      tags: [signals]
      summary: List recent snapshot decisions for a symbol and timeframe (query-param form)
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: timeframe
          in: query
          required: false
          schema:
            type: string
            default: "5m"
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 50
            maximum: 200
      responses:
        "200":
          description: Array of snapshot decisions, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SnapshotDecisionRow"

  /signals/snapshot-decision/{symbol}/{timeframe}:
    get:
      operationId: getSnapshotDecisionHistory
      tags: [signals]
      summary: List recent snapshot decisions for a symbol and timeframe (path form, last 50)
      parameters:
        - name: symbol
          in: path
          required: true
          schema:
            type: string
        - name: timeframe
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Array of snapshot decisions, newest first (last 50)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SnapshotDecisionRow"

  /signals/pipeline-comparison:
    post:
      operationId: pipelineComparison
      tags: [signals]
      summary: Compare classic signal engine vs AI snapshot decisions over a historical window
      description: |
        Runs BOTH pipelines in-memory on the same historical bar window and returns a side-by-side
        comparison report with signal counts, avg confidence, overlap, divergence, and per-bar
        disagreements.

        Old pipeline: generateSignals (deterministic, no Ollama) — fast, always runs.

        New pipeline: filterCandleWithSnapshot called for EVERY bar in the window sequentially
        with 200 ms pacing. Pre-gates (relativeVolume < 0.4, Ollama offline) short-circuit most
        bars instantly. Live Ollama calls are made when Ollama is available.

        If Ollama is offline the new pipeline falls back to previously stored AI snapshot
        decisions from live candle-close events (snapshotDataAvailable=false when no rows exist).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PipelineComparisonRequest"
      responses:
        "200":
          description: Pipeline comparison report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineComparisonReport"

  /signals/replay:
    post:
      operationId: startReplay
      tags: [signals]
      summary: Start a memory-vs-no-memory replay job for a symbol
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplayStartRequest"
      responses:
        "200":
          description: Job started or already running
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayStartResponse"

  /signals/performance/summary:
    get:
      operationId: getPerformanceSummary
      tags: [signals]
      summary: Get aggregated signal performance summary (global, by side, by symbol, by regime, by pattern)
      responses:
        "200":
          description: Performance summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PerformanceSummaryResponse"

  /signals/replay/{jobId}:
    get:
      operationId: getReplayStatus
      tags: [signals]
      summary: Poll a replay job for status and result
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status and optional result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReplayJobStatus"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /signals/ai-replay-historical:
    post:
      operationId: startHistoricalReplay
      tags: [signals]
      summary: Start a single-pass Memory-ON historical AI replay job
      description: >
        Runs the Trade Intelligence Engine (memory enabled) over the last N
        candles for a symbol and returns APPROVE decisions as chart markers.
        Returns immediately with a jobId — poll
        GET /signals/ai-replay-historical/{jobId} for results.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HistoricalReplayStartRequest"
      responses:
        "200":
          description: Job started (or already running — returns existing jobId)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalReplayStartResponse"

  /signals/ai-replay-historical/{jobId}:
    get:
      operationId: getHistoricalReplayStatus
      tags: [signals]
      summary: Poll a historical AI replay job for status and markers
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Job status, progress, and optional marker array
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HistoricalReplayJobStatus"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string

  /news:
    get:
      operationId: getNews
      tags: [news]
      summary: Get recent news headlines for a symbol
      parameters:
        - name: symbol
          in: query
          required: true
          schema:
            type: string
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            default: 10
            maximum: 50
      responses:
        "200":
          description: Array of news items, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/NewsItem"
        "502":
          description: Polygon news fetch failed

components:
  schemas:
    NewsItem:
      type: object
      required: [title, publishedUtc, articleUrl, source, tickers]
      properties:
        title:
          type: string
        publishedUtc:
          type: string
          format: date-time
        articleUrl:
          type: string
        source:
          type: string
        tickers:
          type: array
          items:
            type: string

    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    Symbol:
      type: object
      required: [id, symbol, name, addedAt]
      properties:
        id:
          type: integer
        symbol:
          type: string
        name:
          type: string
        addedAt:
          type: string
          format: date-time

    SymbolInput:
      type: object
      required: [symbol, name]
      properties:
        symbol:
          type: string
          minLength: 1
        name:
          type: string
          minLength: 1

    Signal:
      type: object
      required: [id, signalId, symbol, timeframe, barTime, side, entryPrice, slPrice, tpPrice, confidence, riskTag, state, createdAt]
      properties:
        id:
          type: integer
        signalId:
          type: string
        symbol:
          type: string
        timeframe:
          type: string
        barTime:
          type: string
          format: date-time
        side:
          type: string
          enum: [long, short]
        entryPrice:
          type: number
        slPrice:
          type: number
        tpPrice:
          type: number
        currentSlPrice:
          type: ["number", "null"]
        confidence:
          type: integer
        riskTag:
          type: string
          enum: [Safe, Medium, Danger]
        state:
          type: string
          enum: [active, tp_hit, sl_hit, expired]
        exitPrice:
          type: ["number", "null"]
        exitReason:
          type: ["string", "null"]
        exitBarTime:
          type: ["string", "null"]
          format: date-time
        rrRatio:
          type: ["number", "null"]
        pattern:
          type: ["string", "null"]
        regime:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time

    SignalAlert:
      type: object
      required: [id, symbol, timeframe, verdict, confidence, candleTime, createdAt]
      properties:
        id:
          type: integer
        symbol:
          type: string
        timeframe:
          type: string
        verdict:
          type: string
          description: LONG or SHORT
        confidence:
          type: integer
        entryPrice:
          type: number
          nullable: true
        rrRatio:
          type: number
          nullable: true
        regime:
          type: string
          nullable: true
        candleTime:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    SignalStats:
      type: object
      required: [total, active, tp_hit, sl_hit, expired, winRate, avgConfidence, avgRR]
      properties:
        total:
          type: integer
        active:
          type: integer
        tp_hit:
          type: integer
        sl_hit:
          type: integer
        expired:
          type: integer
        winRate:
          type: number
        avgConfidence:
          type: number
        avgRR:
          type: number

    AiDecisionRegimeStat:
      type: object
      required: [tp_hit, sl_hit, expired, total, winRate]
      properties:
        tp_hit:
          type: integer
        sl_hit:
          type: integer
        expired:
          type: integer
        total:
          type: integer
        winRate:
          type: number

    AiDecisionStats:
      type: object
      required: [total, resolved, tp_hit, sl_hit, expired, winRate, avgRR, byRegime]
      properties:
        total:
          type: integer
          description: All ai_decisions rows matching the filter
        resolved:
          type: integer
          description: Rows with a non-null outcome
        tp_hit:
          type: integer
        sl_hit:
          type: integer
        expired:
          type: integer
        winRate:
          type: number
          description: tp_hit / (tp_hit + sl_hit), 0 when no closed decisions
        avgRR:
          type: number
          description: Average R:R ratio of resolved decisions with an rrRatio set
        byRegime:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/AiDecisionRegimeStat"

    Bar:
      type: object
      required: [time, open, high, low, close, volume]
      properties:
        time:
          type: integer
          description: Unix timestamp in seconds
        open:
          type: number
        high:
          type: number
        low:
          type: number
        close:
          type: number
        volume:
          type: number

    AiStatusExtended:
      type: object
      required: [available, model, endpoint, visionModel, visionAvailable, message]
      properties:
        available:
          type: boolean
        model:
          type: string
        endpoint:
          type: string
        visionModel:
          type: string
        visionAvailable:
          type: boolean
        message:
          type: string

    PatternGroupStat:
      type: object
      required: [symbol, regime, side, strategy, winRate, sampleSize, avgRR]
      properties:
        symbol:
          type: string
        regime:
          type: string
        side:
          type: string
        strategy:
          type: string
        winRate:
          type: number
        sampleSize:
          type: integer
        avgRR:
          type: number

    AiMemorySummary:
      type: object
      required: [ok, source, totalTrades, lessonsCount, patternsCount, similarityMatchesCount, topSimilarityMatches, recentLessons, updatedAt]
      properties:
        ok:
          type: boolean
        source:
          type: string
        totalTrades:
          type: integer
        lessonsCount:
          type: integer
        patternsCount:
          type: integer
        similarityMatchesCount:
          type: integer
          description: Number of unique pattern groups queryable for similarity matching
        topSimilarityMatches:
          type: array
          description: Top pattern groups by historical win rate (n >= 3)
          items:
            $ref: "#/components/schemas/PatternGroupStat"
        regimeStats:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/WinLossStat"
        strategyStats:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/WinLossStat"
        symbolStats:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/WinLossStat"
        recentLessons:
          type: array
          items:
            type: string
        updatedAt:
          type: string

    WinLossStat:
      type: object
      required: [wins, losses, total]
      properties:
        wins:
          type: integer
        losses:
          type: integer
        total:
          type: integer

    AiTradeHealth:
      type: object
      required: [score, breakdown, direction, summary, grade, memoryImpactScore]
      properties:
        score:
          type: integer
          description: Composite health score 0–100
        grade:
          type: string
          enum: [A, B, C, D]
          description: "Letter grade derived from score: A≥80, B≥60, C≥40, D<40"
        memoryImpactScore:
          type: number
          description: Memory influence on this trade 0–100 (higher = memory strongly agrees)
        breakdown:
          type: object
          required: [emaTrend, momentum, volume, priceProgress, patternIntegrity, memoryAlignment, historicalSimilarity, regimeAlignment]
          properties:
            emaTrend:             { type: integer, description: "Market structure + trend quality (0–20)" }
            momentum:             { type: integer, description: "RSI momentum score (0–15)" }
            volume:               { type: integer, description: "Volume strength (0–10)" }
            priceProgress:        { type: integer, description: "Price progress / risk profile (0–20)" }
            patternIntegrity:     { type: integer, description: "Pattern/setup integrity (0–10)" }
            memoryAlignment:      { type: integer, description: "Memory impact alignment (0–10)" }
            historicalSimilarity: { type: integer, description: "Historical setup similarity (0–10)" }
            regimeAlignment:      { type: integer, description: "Regime success alignment (0–5)" }
        direction:
          type: string
          enum: [improving, deteriorating, neutral]
          description: Price movement direction relative to trade thesis over last 5 bars
        summary:
          type: string
          description: One-sentence plain-English health summary

    AiActiveHealthResponse:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        health:
          description: null when no active approved trade exists
          oneOf:
            - $ref: "#/components/schemas/AiTradeHealth"
            - type: "null"

    ChartAnalysisRequest:
      type: object
      required: [imageBase64]
      properties:
        imageBase64:
          type: string
          description: Base64-encoded chart image (PNG or JPEG)
        thumbnailBase64:
          type: string
          description: Small base64 JPEG thumbnail generated client-side for the recent-analyses list
        symbol:
          type: string
        timeframe:
          type: string
        signalId:
          type: string

    ChartAnalysis:
      type: object
      required: [trend, patterns, resistanceLevels, supportLevels, volumeBehavior, marketStructure, supplyZones, demandZones, summary, confidence]
      properties:
        trend:
          type: string
          enum: [strong_uptrend, uptrend, neutral, downtrend, strong_downtrend]
        patterns:
          type: array
          items:
            type: string
        resistanceLevels:
          type: array
          items:
            type: number
        supportLevels:
          type: array
          items:
            type: number
        volumeBehavior:
          type: string
          enum: [expanding, contracting, climax, normal, weak]
        marketStructure:
          type: string
          enum: [higher_highs_lows, lower_highs_lows, range_bound, breakout, breakdown, unclear]
        supplyZones:
          type: array
          items:
            type: number
        demandZones:
          type: array
          items:
            type: number
        summary:
          type: string
        confidence:
          type: integer

    AiDecision:
      type: object
      required: [direction, confidence, entry, stopLoss, takeProfit1, takeProfit2, takeProfit3, riskReward, technicalReasoning, marketStructureReasoning, historicalReasoning, successProbability]
      properties:
        direction:
          type: string
          enum: [LONG, SHORT, NO_TRADE]
        confidence:
          type: integer
        entry:
          type: number
        stopLoss:
          type: number
        takeProfit1:
          type: number
        takeProfit2:
          type: number
        takeProfit3:
          type: number
        riskReward:
          type: number
        technicalReasoning:
          type: string
        marketStructureReasoning:
          type: string
        historicalReasoning:
          type: string
        successProbability:
          type: integer
        noTradeReason:
          type: string
        noTradeMissingCondition:
